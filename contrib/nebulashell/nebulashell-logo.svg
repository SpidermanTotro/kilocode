<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="320" height="120">
  <defs>
    <!-- Deep space background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d1a"/>
      <stop offset="100%" style="stop-color:#1a0d2e"/>
    </linearGradient>
    <!-- Nebula glow gradient for the shell icon -->
    <radialGradient id="nebulaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:0.9"/>
      <stop offset="50%" style="stop-color:#6366f1;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#0d0d1a;stop-opacity:0"/>
    </radialGradient>
    <!-- Text gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e879f9"/>
      <stop offset="50%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#818cf8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="320" height="120" rx="12" fill="url(#bg)"/>

  <!-- Nebula glow orb -->
  <ellipse cx="52" cy="60" rx="42" ry="42" fill="url(#nebulaGlow)" opacity="0.7"/>

  <!-- Stars scattered in background -->
  <circle cx="15"  cy="12"  r="1"   fill="#e879f9" opacity="0.8"/>
  <circle cx="280" cy="18"  r="1.2" fill="#818cf8" opacity="0.7"/>
  <circle cx="300" cy="95"  r="0.8" fill="#a855f7" opacity="0.6"/>
  <circle cx="25"  cy="100" r="1"   fill="#6366f1" opacity="0.7"/>
  <circle cx="160" cy="10"  r="0.9" fill="#e879f9" opacity="0.5"/>
  <circle cx="240" cy="108" r="1.1" fill="#818cf8" opacity="0.6"/>
  <circle cx="8"   cy="55"  r="0.7" fill="#a855f7" opacity="0.5"/>
  <circle cx="315" cy="48"  r="1"   fill="#6366f1" opacity="0.5"/>

  <!-- Shell prompt icon: > _ -->
  <g filter="url(#glow)" transform="translate(52,60)">
    <!-- > chevron -->
    <polyline points="-18,-14  -4,0  -18,14"
              stroke="#e879f9" stroke-width="3.5"
              stroke-linecap="round" stroke-linejoin="round"
              fill="none"/>
    <!-- _ cursor bar -->
    <line x1="-1" y1="14" x2="16" y2="14"
          stroke="#a855f7" stroke-width="3.5"
          stroke-linecap="round"/>
  </g>

  <!-- NEBULA text -->
  <text x="108" y="55"
        font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"
        font-size="32" font-weight="700" letter-spacing="3"
        fill="url(#textGrad)" filter="url(#glow)">NEBULA</text>

  <!-- SHELL text -->
  <text x="110" y="85"
        font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"
        font-size="22" font-weight="300" letter-spacing="8"
        fill="#818cf8" opacity="0.9">SHELL</text>

  <!-- Tagline -->
  <text x="108" y="105"
        font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"
        font-size="9" letter-spacing="1.5"
        fill="#6366f1" opacity="0.7">FEDORA · DISTROBOX · OLLAMA</text>
</svg>
