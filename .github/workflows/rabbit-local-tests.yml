name: Rabbit Code native Fedora tests
on:
  push:
    paths:
      - 'contrib/rabbit-code/**'
      - '.github/workflows/rabbit-local-tests.yml'
  pull_request:
    paths:
      - 'contrib/rabbit-code/**'
      - '.github/workflows/rabbit-local-tests.yml'
jobs:
  native-local:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Python and shell syntax
        run: |
          python -m py_compile contrib/rabbit-code/rabbit_local.py contrib/rabbit-code/fedora/native_app.py
          bash -n contrib/rabbit-code/fedora/install-fedora.sh
      - name: Mocked local Ollama and desktop tests
        run: python -m unittest discover -s contrib/rabbit-code/tests -v
